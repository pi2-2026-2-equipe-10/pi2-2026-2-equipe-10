server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # API: o navegador chama /api/... e o nginx encaminha ao backend (sem o
    # prefixo /api). Assim o front funciona por qualquer endereço da rede,
    # sem IP fixo no build. "backend" é o nome do serviço no docker-compose.
    location /api/ {
        proxy_pass http://backend:3000/;
        # $http_host mantém a porta (ex.: 192.168.0.2:8080). Com $host a porta
        # some e o Spring trata a requisição como CORS de outra origem (403).
        proxy_set_header Host $http_host;
        # A chamada ao backend é interna: não repassa o Origin.
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
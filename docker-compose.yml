services:
  db:
    image: postgres:16
    container_name: grafica_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: grafica
      POSTGRES_USER: grafica_user
      POSTGRES_PASSWORD: grafica_pass
    ports:
      - "5432:5432"
    volumes:
      - grafica_db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafica_user -d grafica"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: grafica_backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/grafica
      DB_USER: grafica_user
      DB_PASSWORD: grafica_pass
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./dsilk-frontend
    container_name: grafica_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  grafica_db_data: